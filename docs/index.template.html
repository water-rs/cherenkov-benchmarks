<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Cherenkov Benchmarks — Performance over commits</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="dashboard.mjs"></script>
</head>
<body>
  <header><div class="shell masthead"><a class="brand" href="./">Cherenkov <span>/ Benchmarks</span></a><nav aria-label="Resources"><a href="https://github.com/water-rs/cherenkov-benchmarks/tree/main/statistics">Data</a><a href="https://github.com/water-rs/cherenkov-benchmarks">GitHub ↗</a></nav></div></header>
  <main class="shell">
    <div class="view-bar"><div class="segments" role="group" aria-label="View"><button id="historyTab" aria-pressed="true">Commit history</button><button id="snapshotTab" aria-pressed="false">Engine comparison</button></div><span id="archiveCount" class="muted" aria-live="polite">Loading measurements…</span></div>
    <p id="error" role="alert" hidden></p>
    <section id="historyView" aria-label="Performance by commit">
      <div class="toolbar">
        <label>Device<select id="historyDevice"></select></label>
        <label>Engine<select id="historyEngine"></select></label>
        <div class="switch-control"><span id="historyMetricLabel">Metric</span><div id="historyMetric" class="segments wrap-segments" role="group" aria-labelledby="historyMetricLabel"></div></div>
        <details class="choice-menu"><summary>Scenes <span id="historySceneCount"></span></summary><div id="historyScenes" class="scene-options" role="group" aria-label="Displayed scenes"></div></details>
      </div>
      <div class="toolbar-meta"><label class="checkbox"><input id="zeroAxis" type="checkbox"> Start axes at zero</label></div>
      <div id="historyPanels" class="scene-grid"></div>
      <template id="historyTemplate"><article class="scene-panel">
      <div class="condition-bar"><label>Test conditions<select data-part="historyConditions"></select></label></div>
      <div class="plot-panel">
        <div class="plot-heading"><div><h2 data-part="metricTitle">Frame p50</h2><p data-part="historyContext" class="muted"></p></div><div class="delta"><strong data-part="historyDelta">—</strong><span>latest vs first measured commit</span></div></div>
        <div class="chart-box"><canvas data-part="historyChart" role="img" aria-label="Performance across commits; values also appear in the table below"></canvas></div>
        <p class="caption">Point: median across runs. Band: run minimum–maximum, not a confidence interval.</p>
        <p data-part="historyNotice" class="notice" aria-live="polite"></p>
      </div>
      <details class="conditions"><summary>Measurement conditions &amp; limitations</summary><div data-part="conditionsText"></div></details>
      <details class="measurements"><summary>Measurements by commit</summary><div class="table-heading"><h2>Measurements by commit</h2><span data-part="pointCount" class="muted"></span></div>
      <div class="table-scroll"><table><thead><tr><th>Commit</th><th>First measured · Eastern</th><th>Median</th><th>Run range</th><th>Δ vs first</th><th>Runs</th><th>Source data</th></tr></thead><tbody data-part="historyRows"></tbody></table></div>
</details>
</article></template>
    </section>
    <section id="snapshotView" aria-label="Cross-engine comparisons" hidden>
      <div class="toolbar">
        <label>Snapshot<select id="snapshotRun"></select></label>
        <label>Device<select id="snapshotDevice"></select></label>
        <div class="switch-control"><span id="backendLabel">Backend</span><div id="snapshotBackend" class="segments" role="group" aria-labelledby="backendLabel"></div></div>
        <div class="switch-control"><span id="snapshotMetricLabel">Metric</span><div id="snapshotMetric" class="segments wrap-segments" role="group" aria-labelledby="snapshotMetricLabel"></div></div>
        <details class="choice-menu"><summary>Scenes <span id="snapshotSceneCount"></span></summary><div id="snapshotScenes" class="scene-options" role="group" aria-label="Displayed scenes"></div></details>
      </div>
      <div class="toolbar-meta"><span id="snapshotCommit" class="muted"></span></div>
      <div id="snapshotPanels" class="scene-grid"></div>
      <template id="snapshotTemplate"><article class="scene-panel">
      <div class="plot-panel"><h2 data-part="snapshotTitle">Engine comparison</h2><div class="comparison-chart"><canvas data-part="comparisonChart" role="img" aria-label="Engine comparison; values also appear in the table below"></canvas></div><p class="caption">Median of three independent rounds. All engines shown for the selected scene and device. Lower is better.</p><p data-part="snapshotNote" class="notice"></p></div>
      <details class="measurements"><summary>Engine measurements</summary><div class="table-heading"><h2>Engine measurements</h2></div>
      <div class="table-scroll"><table><thead><tr><th>Engine</th><th>Frame p50 · ms</th><th>Frame p99 · ms</th><th>GPU p50 · ms</th><th>GPU p99 · ms</th><th>CPU p50 · ms</th><th>Energy · mJ/frame</th><th>Process · MiB</th><th>Driver GPU · MiB</th></tr></thead><tbody data-part="snapshotRows"></tbody></table></div>
</details>
</article></template>
    </section>
  </main>
  <footer class="shell"><a href="https://github.com/water-rs/cherenkov-benchmarks/tree/main/runs">Raw measurements ↗</a></footer>
</body>
</html>
